<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apnea Comp - Email Verified</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #0a1628;
      color: #e8edf8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      font-size: 72px;
      margin-bottom: 8px;
    }
    h1 {
      color: #22c47a;
      font-size: 28px;
      font-weight: 700;
      margin: 8px 0 24px;
    }
    .message {
      background: #1a2d52;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
      opacity: 0.92;
    }
    .lang-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #22c47a;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1>Email Verified</h1>

    <div class="message">
      <div class="lang-label">EN</div>
      <p>Your email has been successfully verified.<br>
      Please return to the Apnea Comp app to sign in.</p>
    </div>

    <div class="message">
      <div class="lang-label">한국어</div>
      <p>이메일 인증이 완료되었습니다.<br>
      Apnea Comp 앱으로 돌아가 로그인해주세요.</p>
    </div>

    <div class="footer">Apnea Comp · ELfreediving</div>
  </div>
</body>
</html>
